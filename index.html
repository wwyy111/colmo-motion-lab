<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLMO · 语义动效实验室</title><meta name="description" content="八种语义状态，分层玻璃形象。预览、理解并编排 AI 交互。"><link rel="stylesheet" href="style.css"></head>
<body><link rel="stylesheet" href="update.css"><link rel="stylesheet" href="workbench.css">
<header><a class="wordmark" href="#overview" aria-label="返回状态总览"><img src="assets/colmo-logo.png" alt="COLMO"></a><nav aria-label="页面"><a href="#overview" id="nav-overview">01 状态总览</a><a href="#studio" id="nav-studio">02 交互编排<span class="dot"></span></a></nav></header>
<main>
<section id="overview">
 <div class="toolbar"><div class="toolbar-right"><label class="check"><input type="checkbox" id="motion-toggle" checked> 动效预览</label><button id="restart-previews" class="quiet">重新播放 ↻</button></div></div>
 <div class="state-grid" id="state-grid"></div>
 <div class="overview-cta"><a class="primary" href="#studio">开始编排</a></div>
</section>
<section id="studio" hidden>
<div class="studio-title"><h1>交互编排</h1><div class="file-actions"><select id="case-list" aria-label="已保存案例"></select><button id="case-new">新建案例</button><button id="case-import">导入案例 / 表格</button><button id="case-export-all">导出全部案例</button><input type="file" id="case-file" accept=".json,.csv,.xlsx,.xls" hidden></div></div>
<div class="case-meta"><label>案例名称<input id="case-name" maxlength="100" placeholder="例如：食材存入与确认"></label><label>情景<input id="scenario" maxlength="500" placeholder="描述这个案例发生的情景"></label></div>
<details class="source-panel"><summary>从描述整理交互流程</summary><p>粘贴需求、表达方案或编号步骤，生成可编辑草稿。使用本地规则解析，不调用大模型；内容需人工核对。</p><textarea id="source-text" maxlength="20000" placeholder="例如：用户点击入口进入 AI 管家页面—入场；用户说存入了一个西红柿—聆听—处理中；AI 展示待确认清单—陈述说明—等待回应"></textarea><div class="source-actions"><button class="primary" id="generate">生成流程草稿</button><button id="food-example">载入食材案例</button><span id="generate-status" role="status"></span></div></details>
<div class="studio-workspace"><div class="workbench-tools">
<aside class="library"><div class="section-label">分层玻璃素材 <span>拖到步骤下方，或点 ＋</span></div><div id="library"></div><p id="target-step"></p></aside>
<div class="preview-area"><div class="preview-top"><span id="current-kind">预览</span><span>分层玻璃</span></div><div class="stage"><canvas id="main-canvas" aria-label="当前语义动效预览"></canvas><div class="stage-caption"><span id="stage-badge"></span><p id="stage-text"></p></div></div><div class="transport"><button id="rewind" aria-label="返回开头">↤</button><button id="play" class="primary">播放序列</button><output id="timecode"></output><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><select id="mode" aria-label="播放模式"><option value="auto">定时演示</option><option value="interactive">交互演示</option></select></div><input id="scrubber" aria-label="播放位置" type="range" min="0" max="1" step="0.01" value="0"><div class="gate"><span id="play-hint"></span><button id="respond" hidden class="primary">继续</button></div></div>
</div><div class="workbench-flow">
<div class="timeline-header"><div><h2>交互流程 × 动画时间轴 <span id="clip-count"></span></h2><p>从左侧拖入素材；右侧流程可独立滚动。</p></div><div class="timeline-actions"><button id="focus-workbench">同屏编排</button><button id="step-add">＋ 添加步骤</button></div></div>

<div class="flow-scroll"><div id="flow-board"></div></div>
<div class="timeline-bottom"><span>拖动片段可跨步骤移动；片段上的 × 可直接删除。</span><span id="save-status"></span></div>
</div></div><section class="narrative"><div class="section-label">整段交互描述 <button id="copy-narrative">复制文字</button></div><p id="narrative-text"></p></section>
<div class="case-savebar"><span id="case-status" role="status"></span><div><button id="case-export">导出当前案例</button><button id="case-save" class="primary">保存案例</button></div></div>
<p class="local-note">案例保存于当前浏览器，不会自动同步到其他设备。可导出全部案例为 JSON，再导入恢复；文件只在本地读取。</p>
</section></main><dialog id="sheet-dialog"><div class="section-label">选择要整理的表格内容 <button id="sheet-close">关闭</button></div><label>工作表<select id="sheet-name"></select></label><label>表头行<input id="sheet-header" type="number" min="1" max="100" value="1"></label><label>描述列（可多选）<select id="sheet-cols" multiple size="5"></select></label><p>每个非空行作为一个流程步骤。复杂单元格可复制到描述框重新细分。</p><button id="sheet-apply" class="primary">转为流程草稿</button></dialog><div id="toast" role="status" aria-live="polite"></div><script src="vendor/xlsx.full.min.js"></script><script src="flow-parser.js"></script><script src="app.js"></script><script src="studio.js"></script><script src="drag.js"></script><script src="tooltip.js"></script></body></html>
